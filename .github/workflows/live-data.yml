name: Live data

# Refreshes data/live.json (stock quotes + Fremont weather) every hour.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_live.py"
      - "data/watchlist.json"
      - ".github/workflows/live-data.yml"

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quotes and weather
        run: python scripts/fetch_live.py
      - name: Commit if changed
        run: |
          git config user.name "Keanu's Daily Feed bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Live data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
